name: Preview QA Evidence

on:
  push:
    branches:
      - feat/licensing-premium-conversion
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-qa:
    name: Capture licensing and admin evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://feat-licensing-premium-conve.conductalchemy-site.pages.dev
      WORKER_ORIGIN: https://dark-voice-ab4b.rapidstillz.workers.dev
      DEPLOY_MARKER: Availability and the rights Conduct Alchemy can license are confirmed case by case

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci --silent

      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.53.1
          npx playwright install --with-deps chromium

      - name: Wait for current branch preview content
        shell: bash
        run: |
          mkdir -p qa-evidence
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const origin = process.env.PREVIEW_ORIGIN;
          const marker = process.env.DEPLOY_MARKER;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          let lastError = 'preview did not render';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const response = await page.goto(`${origin}/licensing`, { waitUntil: 'domcontentloaded', timeout: 30_000 });
              if (!response || response.status() < 200 || response.status() >= 400) throw new Error(`HTTP ${response?.status() ?? 0}`);
              await page.getByText(marker, { exact: false }).waitFor({ timeout: 10_000 });
              console.log('Current client-rendered licensing content is deployed.');
              await browser.close();
              process.exit(0);
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
              console.log(`Waiting for current licensing content (${attempt}/30): ${lastError}`);
              await page.waitForTimeout(15_000);
            }
          }
          await browser.close();
          throw new Error(`Branch preview did not render the current marker: ${lastError}`);
          EOF

      - name: Capture deployed preview evidence
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const origin = process.env.PREVIEW_ORIGIN;
          const browser = await chromium.launch({ headless: true });
          const findings = [];

          async function capture(name, path, viewport, interaction) {
            const page = await browser.newPage({ viewport });
            const consoleErrors = [];
            const failedRequests = [];
            page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('requestfailed', (request) => failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? 'unknown' }));
            const response = await page.goto(`${origin}${path}`, { waitUntil: 'networkidle', timeout: 45_000 });
            const status = response?.status() ?? 0;
            if (status < 200 || status >= 400) throw new Error(`${path} returned HTTP ${status}`);
            if (interaction) await interaction(page);
            const actualViewport = await page.evaluate(() => ({ width: innerWidth, height: innerHeight, devicePixelRatio }));
            if (actualViewport.width !== viewport.width || actualViewport.height !== viewport.height) {
              throw new Error(`${name} viewport mismatch: expected ${viewport.width}x${viewport.height}, got ${actualViewport.width}x${actualViewport.height}`);
            }
            const logo = await page.locator('header .ca-logo').getAttribute('src').catch(() => null);
            await page.screenshot({ path: `qa-evidence/${name}.png`, fullPage: true });
            findings.push({ name, url: page.url(), status, title: await page.title(), requestedViewport: viewport, actualViewport, logo, consoleErrors, failedRequests });
            await page.close();
          }

          await capture('licensing-desktop', '/licensing', { width: 1440, height: 1100 });
          await capture('licensing-mobile', '/licensing', { width: 390, height: 844 });
          await capture('licensing-artifact-desktop', '/licensing', { width: 1440, height: 1100 }, async (page) => {
            await page.getByRole('button', { name: 'View as Artifact' }).click();
            await page.getByRole('button', { name: 'Exit Artifact' }).waitFor();
            if (!(await page.locator('main').getAttribute('class'))?.includes('artifact')) throw new Error('Artifact Mode class was not applied');
            const logoSrc = await page.locator('header .ca-logo').getAttribute('src');
            if (logoSrc !== '/brand/conduct-alchemy/logo/svg/ca-logo-nav-black.svg') throw new Error(`Artifact Mode logo mismatch: ${logoSrc}`);
          });
          await capture('admin-desktop', '/admin', { width: 1440, height: 1100 });

          await browser.close();
          await fs.writeFile('qa-evidence/report.json', JSON.stringify({ origin, generatedAt: new Date().toISOString(), findings }, null, 2));
          const hardFailures = findings.flatMap((finding) => [
            ...finding.consoleErrors.map((error) => `${finding.name}: console error: ${error}`),
            ...finding.failedRequests.map((request) => `${finding.name}: request failed: ${request.url} (${request.failure})`),
          ]);
          if (hardFailures.length) throw new Error(hardFailures.join('\n'));
          EOF

      - name: Exercise live form and admin Worker compatibility once
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const origin = process.env.PREVIEW_ORIGIN;
          const worker = process.env.WORKER_ORIGIN;
          const run = process.env.GITHUB_RUN_ID;
          const testName = `CA QA ${run}`;
          const testEmail = `ca-qa-${run}@example.invalid`;
          const testTrack = `Worker compatibility ${run}`;
          const testUsage = 'Automated QA only — safe to ignore';
          const testBudget = '£5k-£10k';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function fetchLeads() {
            const response = await fetch(`${worker}/leads`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`GET /leads failed: ${response.status}`);
            return response.json();
          }

          async function pollForLead(predicate, description, { attempts = 20, delayMs = 1500 } = {}) {
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const lead = (await fetchLeads()).find(predicate);
              if (lead) {
                console.log(`${description} confirmed on attempt ${attempt}/${attempts}.`);
                return lead;
              }
              if (attempt < attempts) await sleep(delayMs);
            }
            throw new Error(`${description} was not observable after ${attempts} attempts`);
          }

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const consoleErrors = [];
          const failedRequests = [];
          let submittedPayload;
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('requestfailed', (request) => failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? 'unknown' }));
          page.on('request', (request) => {
            if (request.method() === 'POST' && request.url() === `${worker}/submit`) submittedPayload = request.postDataJSON();
          });

          await page.goto(`${origin}/licensing`, { waitUntil: 'networkidle', timeout: 45_000 });
          await page.getByPlaceholder('Your name').fill(testName);
          await page.getByPlaceholder('you@company.com').fill(testEmail);
          await page.getByPlaceholder('Company, agency, studio or production').fill('Conduct Alchemy QA');
          await page.getByPlaceholder('Track name, reference, mood or scene').fill(testTrack);
          await page.getByLabel('Project type').selectOption({ label: 'Advertising / Brand Campaign' });
          await page.getByLabel('Territory').selectOption({ label: 'Worldwide' });
          await page.getByLabel('Duration').selectOption({ label: '1 Year' });
          await page.getByLabel('Paid media').selectOption({ label: 'Yes / paid media planned' });
          await page.getByPlaceholder('Optional / to be discussed').fill(testBudget);
          await page.getByPlaceholder(/Tell us about the scene/).fill(testUsage);
          await page.getByText('Exclusivity or category restriction may be required').click();
          await page.getByRole('button', { name: 'Submit project brief' }).click();
          await page.getByRole('heading', { name: 'Clearance request received.' }).waitFor({ timeout: 30_000 });
          await page.screenshot({ path: 'qa-evidence/form-submission-success.png', fullPage: true });

          if (!submittedPayload) throw new Error('Browser did not capture the /submit request payload');
          const expectedPayload = {
            name: testName,
            email: testEmail,
            track: testTrack,
            usage: 'Ads',
            projectType: 'Advertising / Brand Campaign',
            intendedUsage: testUsage,
            duration: '1 Year',
            territory: 'Worldwide',
            paidMedia: 'Yes / paid media planned',
            budgetRange: testBudget,
            value: 0,
            message: testUsage,
            exclusive: true,
          };
          for (const [field, value] of Object.entries(expectedPayload)) {
            if (submittedPayload[field] !== value) throw new Error(`Submitted payload mismatch for ${field}: expected ${JSON.stringify(value)}, got ${JSON.stringify(submittedPayload[field])}`);
          }

          const lead = await pollForLead((item) => item.name === testName && item.email === testEmail, 'Submitted QA lead');
          if (lead.track !== testTrack) throw new Error(`Persisted track mismatch: ${JSON.stringify(lead.track)}`);
          if (Number(lead.value) !== 0) throw new Error(`Persisted legacy value is not numeric zero: ${JSON.stringify(lead.value)}`);

          const update = async (status, value) => {
            const response = await fetch(`${worker}/update-status`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: lead.id, status, value }),
            });
            if (!response.ok) throw new Error(`POST /update-status failed for ${status}: ${response.status}`);
          };

          await update('CONTACTED', 1234);
          const updated = await pollForLead((item) => item.id === lead.id && item.status === 'CONTACTED' && Number(item.value) === 1234, 'Admin CONTACTED/value mutation');
          await update('NEW', 0);
          const cleaned = await pollForLead((item) => item.id === lead.id && item.status === 'NEW' && Number(item.value) === 0, 'Admin mutation cleanup');

          await page.goto(`${origin}/admin`, { waitUntil: 'networkidle', timeout: 45_000 });
          await page.getByText(testName, { exact: true }).waitFor({ timeout: 30_000 });
          await page.screenshot({ path: 'qa-evidence/admin-test-lead.png', fullPage: true });
          await browser.close();

          const result = {
            generatedAt: new Date().toISOString(), testName, leadId: lead.id,
            formSubmission: 'passed', submittedPayloadCompatibility: 'passed',
            persistedLegacyCompatibility: 'passed', adminLeadVisibility: 'passed',
            statusMutation: updated.status === 'CONTACTED' ? 'passed' : 'failed',
            dealValueMutation: Number(updated.value) === 1234 ? 'passed' : 'failed',
            cleanupState: { status: cleaned.status, value: cleaned.value },
            consistencyStrategy: { attempts: 20, delayMs: 1500 }, consoleErrors, failedRequests,
          };
          await fs.writeFile('qa-evidence/worker-smoke.json', JSON.stringify(result, null, 2));
          if (consoleErrors.length || failedRequests.length) throw new Error(`Browser diagnostics failed: ${JSON.stringify({ consoleErrors, failedRequests })}`);
          EOF

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduct-alchemy-preview-qa
          path: qa-evidence
          if-no-files-found: error
          retention-days: 14
