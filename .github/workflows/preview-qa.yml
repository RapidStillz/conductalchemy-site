name: Preview QA Evidence

on:
  push:
    branches:
      - feat/licensing-premium-conversion
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/preview-qa.yml'
      - 'public/brand/conduct-alchemy/**'
      - 'src/config/env.js'
      - 'src/config/env.ts'
      - 'src/pages/admin.tsx'
      - 'src/pages/licensing.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-qa:
    name: Capture licensing and admin evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://feat-licensing-premium-conve.conductalchemy-site.pages.dev
      WORKER_ORIGIN: https://dark-voice-ab4b.rapidstillz.workers.dev
      DEPLOY_MARKER: Availability and the rights Conduct Alchemy can license are confirmed case by case

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci --silent

      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.53.1
          npx playwright install --with-deps chromium

      - name: Wait for current branch preview content
        shell: bash
        run: |
          mkdir -p qa-evidence
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const origin = process.env.PREVIEW_ORIGIN;
          const marker = process.env.DEPLOY_MARKER;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          let lastError = 'preview did not render';
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            try {
              const response = await page.goto(`${origin}/licensing`, {
                waitUntil: 'domcontentloaded',
                timeout: 30_000,
              });
              if (!response || response.status() < 200 || response.status() >= 400) {
                throw new Error(`HTTP ${response?.status() ?? 0}`);
              }
              await page.getByText(marker, { exact: false }).waitFor({ timeout: 10_000 });
              console.log('Current client-rendered licensing content is deployed.');
              await browser.close();
              process.exit(0);
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
              console.log(`Waiting for rendered current licensing content (attempt ${attempt}/30): ${lastError}`);
              await page.waitForTimeout(15_000);
            }
          }
          await browser.close();
          throw new Error(`Branch preview did not render the expected current-head marker: ${lastError}`);
          EOF

      - name: Capture deployed preview evidence
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const origin = process.env.PREVIEW_ORIGIN;
          if (!origin) throw new Error('PREVIEW_ORIGIN is required');

          const browser = await chromium.launch({ headless: true });
          const findings = [];

          async function capture(name, path, viewport, interaction) {
            const page = await browser.newPage({ viewport });
            const consoleErrors = [];
            const failedRequests = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? 'unknown' });
            });

            const response = await page.goto(`${origin}${path}`, { waitUntil: 'networkidle', timeout: 45_000 });
            const status = response?.status() ?? 0;
            if (status < 200 || status >= 400) throw new Error(`${path} returned HTTP ${status}`);
            if (interaction) await interaction(page);

            const actualViewport = await page.evaluate(() => ({
              width: window.innerWidth,
              height: window.innerHeight,
              devicePixelRatio: window.devicePixelRatio,
            }));
            if (actualViewport.width !== viewport.width || actualViewport.height !== viewport.height) {
              throw new Error(`${name} viewport mismatch: expected ${viewport.width}x${viewport.height}, got ${actualViewport.width}x${actualViewport.height}`);
            }

            await page.screenshot({ path: `qa-evidence/${name}.png`, fullPage: true });
            const bodyText = (await page.locator('body').innerText()).trim();
            findings.push({
              name,
              url: page.url(),
              status,
              title: await page.title(),
              requestedViewport: viewport,
              actualViewport,
              bodyLength: bodyText.length,
              consoleErrors,
              failedRequests,
            });
            await page.close();
          }

          await capture('licensing-desktop', '/licensing', { width: 1440, height: 1100 });
          await capture('licensing-mobile', '/licensing', { width: 390, height: 844 });
          await capture('licensing-artifact-desktop', '/licensing', { width: 1440, height: 1100 }, async (page) => {
            await page.getByRole('button', { name: 'View as Artifact' }).click();
            await page.getByRole('button', { name: 'Exit Artifact' }).waitFor();
            const mainClass = await page.locator('main').getAttribute('class');
            if (!mainClass?.includes('artifact')) throw new Error('Artifact Mode class was not applied');
            const logoSrc = await page.locator('header .ca-logo').getAttribute('src');
            if (logoSrc !== '/brand/conduct-alchemy/logo/svg/ca-logo-nav-black.svg') {
              throw new Error(`Artifact Mode logo mismatch: ${logoSrc}`);
            }
          });
          await capture('admin-desktop', '/admin', { width: 1440, height: 1100 });

          await browser.close();
          await fs.writeFile('qa-evidence/report.json', JSON.stringify({ origin, generatedAt: new Date().toISOString(), findings }, null, 2));
          const hardFailures = findings.flatMap((finding) => [
            ...finding.consoleErrors.map((error) => `${finding.name}: console error: ${error}`),
            ...finding.failedRequests.map((request) => `${finding.name}: request failed: ${request.url} (${request.failure})`),
          ]);
          if (hardFailures.length) throw new Error(hardFailures.join('\n'));
          EOF

      - name: Exercise live form and admin Worker compatibility once
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[worker-smoke]')
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const origin = process.env.PREVIEW_ORIGIN;
          const worker = process.env.WORKER_ORIGIN;
          const run = process.env.GITHUB_RUN_ID;
          const testName = `CA QA ${run}`;
          const testEmail = `ca-qa-${run}@example.invalid`;
          const testTrack = `Worker compatibility ${run}`;
          const testUsage = 'Automated QA only — safe to ignore';
          const testBudget = '1234';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const consoleErrors = [];
          const failedRequests = [];
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('requestfailed', (request) => {
            failedRequests.push({ url: request.url(), failure: request.failure()?.errorText ?? 'unknown' });
          });

          await page.goto(`${origin}/licensing`, { waitUntil: 'networkidle', timeout: 45_000 });
          await page.getByPlaceholder('Your name').fill(testName);
          await page.getByPlaceholder('you@company.com').fill(testEmail);
          await page.getByPlaceholder('Company, agency, studio or production').fill('Conduct Alchemy QA');
          await page.getByPlaceholder('Track name, reference, mood or scene').fill(testTrack);
          await page.getByLabel('Project type').selectOption({ label: 'Advertising / Brand Campaign' });
          await page.getByLabel('Territory').selectOption({ label: 'Worldwide' });
          await page.getByLabel('Duration').selectOption({ label: '1 Year' });
          await page.getByLabel('Paid media').selectOption({ label: 'Yes / paid media planned' });
          await page.getByPlaceholder('Optional / to be discussed').fill(testBudget);
          await page.getByPlaceholder(/Tell us about the scene/).fill(testUsage);
          await page.getByText('Exclusivity or category restriction may be required').click();
          await page.getByRole('button', { name: 'Submit project brief' }).click();
          await page.getByRole('heading', { name: 'Clearance request received.' }).waitFor({ timeout: 30_000 });
          await page.screenshot({ path: 'qa-evidence/form-submission-success.png', fullPage: true });

          const leadsResponse = await fetch(`${worker}/leads`);
          if (!leadsResponse.ok) throw new Error(`GET /leads failed: ${leadsResponse.status}`);
          const leads = await leadsResponse.json();
          const lead = leads.find((item) => item.name === testName);
          if (!lead) throw new Error('Submitted QA lead was not returned by /leads');

          const expected = {
            track: testTrack,
            usage: 'Ads',
            duration: '1 Year',
            territory: 'Worldwide',
            exclusive: true,
            value: testBudget,
          };
          for (const [field, value] of Object.entries(expected)) {
            if (lead[field] !== value) {
              throw new Error(`Legacy payload mismatch for ${field}: expected ${JSON.stringify(value)}, got ${JSON.stringify(lead[field])}`);
            }
          }

          const update = async (status, value) => {
            const response = await fetch(`${worker}/update-status`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: lead.id, status, value }),
            });
            if (!response.ok) throw new Error(`POST /update-status failed for ${status}: ${response.status}`);
          };

          await update('CONTACTED', 1234);
          let afterUpdate = await (await fetch(`${worker}/leads`)).json();
          let updated = afterUpdate.find((item) => item.id === lead.id);
          if (updated?.status !== 'CONTACTED' || Number(updated?.value) !== 1234) {
            throw new Error('Admin mutation verification failed after CONTACTED/value update');
          }

          await update('NEW', 0);
          afterUpdate = await (await fetch(`${worker}/leads`)).json();
          updated = afterUpdate.find((item) => item.id === lead.id);
          if (updated?.status !== 'NEW' || Number(updated?.value) !== 0) {
            throw new Error('Admin mutation cleanup verification failed');
          }

          await page.goto(`${origin}/admin`, { waitUntil: 'networkidle', timeout: 45_000 });
          await page.getByText(testName, { exact: true }).waitFor({ timeout: 30_000 });
          await page.screenshot({ path: 'qa-evidence/admin-test-lead.png', fullPage: true });
          await browser.close();

          const result = {
            generatedAt: new Date().toISOString(),
            testName,
            leadId: lead.id,
            formSubmission: 'passed',
            legacyPayloadCompatibility: 'passed',
            adminLeadVisibility: 'passed',
            statusMutation: 'passed',
            dealValueMutation: 'passed',
            cleanupState: { status: updated.status, value: updated.value },
            consoleErrors,
            failedRequests,
          };
          await fs.writeFile('qa-evidence/worker-smoke.json', JSON.stringify(result, null, 2));
          if (consoleErrors.length || failedRequests.length) {
            throw new Error(`Browser diagnostics failed: ${JSON.stringify({ consoleErrors, failedRequests })}`);
          }
          EOF

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduct-alchemy-preview-qa
          path: qa-evidence
          if-no-files-found: error
          retention-days: 14
