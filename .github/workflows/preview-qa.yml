name: Preview QA Evidence

on:
  push:
    branches:
      - feat/licensing-premium-conversion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-qa:
    name: Capture licensing and admin evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_ORIGIN: https://feat-licensing-premium-conve.conductalchemy-site.pages.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci --silent

      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.53.1
          npx playwright install --with-deps chromium

      - name: Wait for branch preview
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location "$PREVIEW_ORIGIN/licensing" >/dev/null; then
              exit 0
            fi
            echo "Preview not ready yet (attempt $attempt/20)"
            sleep 15
          done
          echo "Preview did not become available" >&2
          exit 1

      - name: Capture deployed preview evidence
        shell: bash
        run: |
          mkdir -p qa-evidence
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const origin = process.env.PREVIEW_ORIGIN;
          if (!origin) throw new Error('PREVIEW_ORIGIN is required');

          const browser = await chromium.launch({ headless: true });
          const findings = [];

          async function capture(name, path, viewport) {
            const page = await browser.newPage({ viewportSize: viewport });
            const consoleErrors = [];
            const failedRequests = [];

            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('requestfailed', (request) => {
              failedRequests.push({
                url: request.url(),
                failure: request.failure()?.errorText ?? 'unknown',
              });
            });

            const response = await page.goto(`${origin}${path}`, {
              waitUntil: 'networkidle',
              timeout: 45_000,
            });

            const status = response?.status() ?? 0;
            if (status < 200 || status >= 400) {
              throw new Error(`${path} returned HTTP ${status}`);
            }

            await page.screenshot({
              path: `qa-evidence/${name}.png`,
              fullPage: true,
            });

            const bodyText = (await page.locator('body').innerText()).trim();
            findings.push({
              name,
              url: page.url(),
              status,
              title: await page.title(),
              viewport,
              bodyLength: bodyText.length,
              consoleErrors,
              failedRequests,
            });

            await page.close();
          }

          await capture('licensing-desktop', '/licensing', { width: 1440, height: 1100 });
          await capture('licensing-mobile', '/licensing', { width: 390, height: 844 });
          await capture('admin-desktop', '/admin', { width: 1440, height: 1100 });

          await browser.close();
          await fs.writeFile(
            'qa-evidence/report.json',
            JSON.stringify({ origin, generatedAt: new Date().toISOString(), findings }, null, 2),
          );

          const hardFailures = findings.flatMap((finding) => [
            ...finding.consoleErrors.map((error) => `${finding.name}: console error: ${error}`),
            ...finding.failedRequests.map(
              (request) => `${finding.name}: request failed: ${request.url} (${request.failure})`,
            ),
          ]);

          if (hardFailures.length) {
            console.error(hardFailures.join('\n'));
            process.exitCode = 1;
          }
          EOF

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conduct-alchemy-preview-qa
          path: qa-evidence
          if-no-files-found: error
          retention-days: 14
