name: Homepage Validate

on:
  push:
    branches:
      - ca-homepage-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app files
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Build
        run: npm run build -- --logLevel warn

      - name: Typecheck
        run: npm run typecheck -- --pretty false
