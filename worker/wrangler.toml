name = "conduct-alchemy-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# KV Namespace binding
#
# Create the namespace with:
#   npx wrangler kv:namespace create UNLOCK_STORE
#   npx wrangler kv:namespace create UNLOCK_STORE --preview
#
# Then paste the returned IDs below.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "UNLOCK_STORE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"
